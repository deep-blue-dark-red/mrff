[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrff"
version = "0.2.0"
description = "Scikit-learn-compatible Orthogonal, Structured Orthogonal, Fastfood, Sketch, and Online Random Feature Maps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "mrff contributors" },
]
keywords = [
    "kernel-approximation",
    "random-fourier-features",
    "orthogonal-random-features",
    "sorf",
    "fastfood",
    "tensor-sketch",
    "scikit-learn",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/deep-blue-dark-red/mrff"
Repository = "https://github.com/deep-blue-dark-red/mrff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrff = ["py.typed", "_fwht_c.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
